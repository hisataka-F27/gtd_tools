<!DOCTYPE html>
<!--
  このファイルは node build.js の生成物です。直接編集しないでください。
  変更するときは src/index.html・src/styles/*.css・src/js/*.js を編集してから
  もう一度 node build.js を実行し、このファイルを上書き生成してください。
  （このコメント自体も build.js が自動で付けているので、src/index.html には書かれていません）
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Action — GTD ワークスペース</title>
<style>
/* ==== src/styles/00-tokens.css ==== */
:root{
  --ink:#16202B; --ink2:#42525F; --ink3:#7D8C97;
  --paper:#E7EAE4; --surface:#FBFCF9; --line:#CFD5CB; --line2:#E0E4DC;
  --ai:#24486E; --ai-soft:#E3E9F1;
  --yamabuki:#9A6E0C; --yamabuki-soft:#F2EBD8;
  --koke:#4E6A48; --koke-soft:#E4EBE1;
  --enji:#8C3B39; --enji-soft:#F3E3E2;
  --f-display:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --f-body:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Consolas",monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
::selection{background:var(--ai-soft)}

/* ==== src/styles/10-layout.css ==== */
/* ---------- 骨格 ---------- */
.app{display:grid;grid-template-columns:212px minmax(0,1fr) 336px;height:100vh}
.rail{border-right:1px solid var(--line);padding:18px 0 12px;overflow-y:auto;display:flex;flex-direction:column}
.main{display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.panel{border-left:1px solid var(--line);background:var(--paper);overflow-y:auto;display:flex;flex-direction:column}

/* ---------- ブランド ---------- */
.brand{padding:0 18px 16px}
.brand h1{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0;letter-spacing:.14em}
.brand p{margin:2px 0 0;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink3)}

/* ---------- ビュー一覧 ---------- */
.rail-group{padding:0 10px;margin-bottom:14px}
.rail-label{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);
  padding:0 8px 6px;display:flex;align-items:center;gap:6px}
.rail-label .sp{flex:1}
.rail-label button{font-family:var(--f-body);font-size:10.5px;color:var(--ink3);
  border:1px solid var(--line);border-radius:2px;padding:0 5px;letter-spacing:0}
.rail-label button:hover{color:var(--ink);border-color:var(--ink3)}
.nav{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:var(--r);
  color:var(--ink2);text-align:left;transition:background .12s}
.nav:hover{background:#DDE1DA}
.nav.on{background:var(--ink);color:#F4F6F2}
.nav.on .n{color:#B9C4CD}
.nav .g{width:14px;text-align:center;font-size:12px;color:var(--ink3)}
.nav.on .g{color:#8FA3B3}
.nav .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .n{font-family:var(--f-mono);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav .n.alert{color:var(--enji);font-weight:700}
.rail-foot{margin-top:auto;padding:12px 18px 0;border-top:1px solid var(--line2);
  font-family:var(--f-mono);font-size:10px;color:var(--ink3);line-height:1.9}
.rail-foot b{color:var(--ink2);font-weight:600}
.kbd-hint{margin:6px 0 12px;color:var(--ink3);font-size:10px;line-height:1.6}

/* ---------- 上部バー ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line2)}
.top h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0;letter-spacing:.06em}
.top .sub{font-family:var(--f-mono);font-size:10px;color:var(--ink3);letter-spacing:.08em}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:var(--r);
  font-size:12px;color:var(--ink2);transition:.12s}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.primary:hover{background:#1B3A5D}
.btn.sm{padding:3px 8px;font-size:11px}
.saved{font-family:var(--f-mono);font-size:10px;color:var(--ink3);min-width:74px;text-align:right}

/* ==== src/styles/20-capture.css ==== */
/* ---------- 収集ボックス ---------- */
.capture{display:flex;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line2);background:var(--surface)}
.capture input{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;background:#fff}
.capture input:focus{border-color:var(--ai);outline:none;box-shadow:0 0 0 3px var(--ai-soft)}

/* ---------- 絞り込み ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 22px;border-bottom:1px solid var(--line2);align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--ink2);background:var(--surface)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#F4F6F2}
.chip-label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);margin-right:2px}
.search{margin-left:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;width:170px;background:var(--surface);font-size:12px}

/* ==== src/styles/30-list.css ==== */
/* ---------- 一覧 ---------- */
.list{flex:1;overflow-y:auto;padding:6px 0 60px}
.grp{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);
  padding:16px 22px 5px;display:flex;gap:8px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line2)}
.row{display:flex;gap:11px;align-items:flex-start;padding:8px 22px;border-bottom:1px solid #F0F2EE;cursor:pointer}
.row:hover{background:#F4F6F1}
.row.sel{background:var(--ai-soft)}
.row.cur{border-left:3px solid var(--ai);padding-left:19px}
.tick{width:15px;height:15px;border:1px solid var(--ink3);border-radius:50%;margin-top:4px;flex:none;background:#fff}
.tick:hover{border-color:var(--koke);background:var(--koke-soft)}
.flag{width:22px;height:22px;border:1px solid var(--line);border-radius:50%;margin-top:2px;flex:none;
  background:#fff;color:var(--line);font-size:12px;line-height:1;cursor:pointer}
.flag:hover{border-color:var(--yamabuki);color:var(--yamabuki)}
.flag.on{border-color:var(--yamabuki);background:var(--yamabuki-soft);color:var(--yamabuki)}
.row-body{flex:1;min-width:0}
.row-t{display:block;word-break:break-word}
.row.done .row-t{color:var(--ink3);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.tag{border:1px solid var(--line);border-radius:2px;padding:0 5px;background:var(--surface)}
.tag.ctx{color:var(--ai);border-color:#BCCBDD;background:var(--ai-soft)}
.tag.wait{color:var(--yamabuki);border-color:#DFD0A6;background:var(--yamabuki-soft)}
.tag.due{color:var(--ink2)}
.tag.over{color:var(--enji);border-color:#DCB9B7;background:var(--enji-soft)}
.tag.stale{color:var(--enji);border-color:#DCB9B7;background:var(--enji-soft)}
.tag.prj{color:var(--koke);border-color:#C3D2BE;background:var(--koke-soft)}

/* ---------- 空状態 ---------- */
.empty{padding:56px 30px;text-align:center;color:var(--ink3);max-width:420px;margin:0 auto}
.empty .mk{font-family:var(--f-display);font-size:30px;color:var(--line);display:block;margin-bottom:10px}
.empty h3{font-family:var(--f-display);font-size:16px;color:var(--ink2);margin:0 0 6px;font-weight:600}
.empty p{margin:0;font-size:12.5px;line-height:1.9}

/* ---------- プロジェクト ---------- */
.prjs{padding:14px 22px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.prj{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 13px;cursor:pointer}
.prj:hover{border-color:var(--ink3)}
.prj h4{margin:0;font-size:14px;font-weight:600}
.prj .out{font-size:11.5px;color:var(--ink2);margin:5px 0 0;padding-left:9px;border-left:2px solid var(--line)}
.prj .st{margin-top:9px;font-family:var(--f-mono);font-size:10px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.prj .warn{color:var(--enji);font-weight:700}

/* ==== src/styles/40-routines.css ==== */
/* ---------- 定型（ルーティン） ---------- */
.tpl-top{display:flex;align-items:center;gap:10px;padding:14px 22px 4px;flex-wrap:wrap}
.tpl-none{font-size:12px;color:var(--ink3)}
.tpl-top .sp{flex:1}
.tpl-grid{padding:6px 22px 14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.tpl{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:12px 13px 10px;cursor:pointer;text-align:left;width:100%;transition:.12s}
.tpl:hover{border-color:var(--ai);box-shadow:0 2px 10px rgba(36,72,110,.10)}
.tpl.due{border-left:3px solid var(--ai);background:linear-gradient(90deg,var(--ai-soft) 0,var(--surface) 46%)}
.tpl.ran{opacity:.55}
.tpl.ran:hover{opacity:1}
.tpl.flash{border-color:var(--koke);background:var(--koke-soft)}
.tpl h4{margin:0 34px 0 0;font-size:14px;font-weight:600;word-break:break-word}
.tpl .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.tpl .cta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line2);
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ai);display:flex;align-items:center;gap:5px}
.tpl.ran .cta{color:var(--ink3)}
.tpl.flash .cta{color:var(--koke);font-weight:700}
.tpl-edit{position:absolute;top:9px;right:9px;border:1px solid var(--line);border-radius:2px;
  padding:1px 6px;font-size:10.5px;color:var(--ink3);background:var(--surface)}
.tpl-edit:hover{color:var(--ink);border-color:var(--ink3)}
.wd{display:flex;gap:4px}
.wd button{flex:1;border:1px solid var(--line);border-radius:2px;padding:5px 0;font-size:12px;
  color:var(--ink2);background:var(--surface)}
.wd button.on{background:var(--ai);border-color:var(--ai);color:#fff}

/* ==== src/styles/50-panel.css ==== */
/* ---------- 右パネル ---------- */
.p-head{padding:14px 18px 10px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.p-head h3{font-family:var(--f-display);font-size:14px;margin:0;font-weight:600;letter-spacing:.08em;flex:1}
.p-body{padding:16px 18px 40px;flex:1}
.f{margin-bottom:13px}
.f label{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;background:var(--surface)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ai);outline:none;box-shadow:0 0 0 3px var(--ai-soft)}
.f textarea{min-height:74px;resize:vertical;line-height:1.7}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.p-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.danger{color:var(--enji);border-color:#DCB9B7}
.danger:hover{border-color:var(--enji);color:var(--enji)}

/* ---------- 明確化フロー（署名要素） ---------- */
.clar{position:relative;padding-left:22px}
.clar::before{content:"";position:absolute;left:5px;top:6px;bottom:14px;width:1px;background:var(--line)}
.step{position:relative;margin-bottom:16px}
.step::before{content:"";position:absolute;left:-21px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:1px solid var(--ink3)}
.step.past::before{background:var(--ink);border-color:var(--ink)}
.step.now::before{background:var(--ai);border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.step .q{font-family:var(--f-display);font-size:14.5px;font-weight:600;letter-spacing:.03em}
.step .hint{font-size:11.5px;color:var(--ink3);margin-top:2px}
.step.past .q{font-size:12px;font-weight:400;color:var(--ink3);font-family:var(--f-body)}
.step .ans{font-family:var(--f-mono);font-size:10px;color:var(--ai);margin-left:6px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 11px;
  text-align:left;font-size:13px;transition:.12s}
.opt:hover{border-color:var(--ai);background:var(--ai-soft)}
.opt small{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.subj{font-family:var(--f-display);font-size:15px;line-height:1.6;padding:11px 13px;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--ai);border-radius:var(--r);margin-bottom:18px;word-break:break-word}

/* ==== src/styles/60-review.css ==== */
/* ---------- 週次レビュー ---------- */
.ov{position:fixed;inset:0;background:rgba(22,32,43,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.sheet{background:var(--surface);border-radius:5px;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(22,32,43,.28)}
.sheet-head{padding:18px 24px 14px;border-bottom:1px solid var(--line2)}
.sheet-head h3{font-family:var(--f-display);font-size:19px;margin:0;font-weight:600;letter-spacing:.1em}
.sheet-head p{margin:3px 0 0;font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em}
.prog{display:flex;gap:3px;margin-top:13px}
.prog i{flex:1;height:3px;background:var(--line2);border-radius:2px}
.prog i.on{background:var(--ai)}
.prog i.done{background:var(--ink)}
.sheet-body{padding:20px 24px;overflow-y:auto;flex:1}
.sheet-body h4{font-family:var(--f-display);font-size:16px;margin:0 0 4px;font-weight:600}
.sheet-body .lead{font-size:12.5px;color:var(--ink2);margin:0 0 14px}
.rv-list{border:1px solid var(--line2);border-radius:var(--r);background:var(--paper);max-height:280px;overflow-y:auto}
.rv-item{display:flex;gap:9px;align-items:flex-start;padding:7px 12px;border-bottom:1px solid var(--line2);font-size:13px}
.rv-item:last-child{border-bottom:none}
.rv-item .sp{flex:1;min-width:0;word-break:break-word}
.rv-item .rv-acts{flex:none;display:flex;gap:5px;flex-wrap:nowrap}
.rv-ok{padding:16px;text-align:center;font-size:13px;color:var(--koke);background:var(--koke-soft);
  border:1px solid #C3D2BE;border-radius:var(--r)}
.sheet-foot{padding:13px 24px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center}

.notice{margin:10px 22px 0;padding:8px 12px;border:1px solid #DFD0A6;background:var(--yamabuki-soft);
  border-radius:var(--r);font-size:12px;color:var(--yamabuki)}
.errbar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--enji);color:#fff;
  padding:9px 16px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.6}
.errbar .msg{flex:1;font-family:var(--f-mono);font-size:11px;word-break:break-all;max-height:90px;overflow-y:auto}
.errbar button{border:1px solid rgba(255,255,255,.5);border-radius:var(--r);padding:2px 9px;
  font-size:11px;color:#fff;flex:none}
.errbar button:hover{background:rgba(255,255,255,.15)}
.ctx-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.ctx-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:var(--surface)}
.ctx-row input:focus{border-color:var(--ai);outline:none;box-shadow:0 0 0 3px var(--ai-soft)}
.ctx-row .n{font-family:var(--f-mono);font-size:10px;color:var(--ink3);min-width:18px;text-align:right}
.ctx-row button{flex:none;border:1px solid var(--line);border-radius:2px;padding:2px 6px;font-size:11px;color:var(--ink3)}
.ctx-row button:hover:not(:disabled){color:var(--ink);border-color:var(--ink3)}
.ctx-row button:disabled{opacity:.3;cursor:default}
.ctx-row button.x:hover{color:var(--enji);border-color:var(--enji)}
.tip{font-size:11.5px;color:var(--ink2);line-height:1.85;background:var(--surface);
  border:1px solid var(--line2);border-left:2px solid var(--ai);border-radius:var(--r);padding:9px 11px;margin-bottom:14px}
.tip b{font-weight:600}
.sect{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);
  margin:22px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.sect:first-child{margin-top:0}
.hide{display:none!important}

/* ==== src/styles/70-toast.css ==== */
/* ---------- トースト（取り消し） ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;
  display:flex;gap:12px;align-items:center;
  background:var(--ink);color:var(--surface);
  padding:9px 12px 9px 16px;border-radius:var(--r);
  box-shadow:0 10px 28px rgba(22,32,43,.32);
  font-size:12.5px;max-width:min(92vw,420px);
}
#toast .toast-msg{flex:1;min-width:0}
#toast .toast-undo{
  flex:none;border:1px solid rgba(251,252,249,.5);border-radius:var(--r);
  padding:4px 10px;font-size:11.5px;color:var(--surface);
}
#toast .toast-undo:hover{background:rgba(251,252,249,.15)}

/* ==== src/styles/90-responsive.css ==== */
/* ---------- 応答 ---------- */
@media(max-width:1080px){
  .app{grid-template-columns:180px minmax(0,1fr)}
  .panel{position:fixed;right:0;top:0;bottom:0;width:min(360px,86vw);z-index:40;
    box-shadow:-8px 0 30px rgba(22,32,43,.16)}
  .panel.closed{display:none}
}
@media(max-width:720px){
  .app{grid-template-columns:1fr;height:auto;min-height:100vh}
  .rail{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px 0}
  .brand{display:none}
  .rail-group{display:flex;gap:4px;margin:0;padding:0 10px}
  .rail-label,.rail-foot{display:none}
  .nav{width:auto;padding:5px 10px}
  .panel{width:100vw}
  .top,.capture,.filters,.row,.grp,.prjs{padding-left:14px;padding-right:14px}
  .search{width:120px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>

<div class="app">
  <!-- ============ 左：ビュー ============ -->
  <nav class="rail">
    <div class="brand">
      <h1 id="brandName">みなも</h1>
      <p id="brandTag">MIND LIKE WATER</p>
    </div>
    <div class="rail-group" id="navMain"></div>
    <div class="rail-group">
      <div class="rail-label">CONTEXT<span class="sp"></span><button data-open="settings">編集</button></div>
      <div id="navCtx"></div>
    </div>
    <div class="rail-foot">
      最終レビュー <b id="lastRev">—</b><br>
      保管 <b id="itemCount">0</b> 件<br>
      版 <b id="buildId">—</b>
      <p class="kbd-hint">j/k 移動 · Enter 開く · x 完了 · t 今日やる · ⌘Z 取り消し</p>
    </div>
  </nav>

  <!-- ============ 中央：一覧 ============ -->
  <main class="main">
    <div class="top">
      <h2 id="vTitle">収集トレイ</h2>
      <span class="sub" id="vSub"></span>
      <span class="sp"></span>
      <span class="saved" id="savedAt"></span>
      <button class="btn" id="btnExport">書き出し</button>
      <button class="btn" id="btnImport">読み込み</button>
      <button class="btn primary" id="btnReview">週次レビュー</button>
      <input type="file" id="fileIn" accept="application/json" class="hide">
    </div>

    <div class="notice hide" id="noStore">

  let bar = document.getElementById("errBar");
  if(!bar){
    bar = document.createElement("div");

    bar.innerHTML = `<div class="msg" id="errMsg"></div>

        if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});

    });

  const box = document.getElementById("errMsg");
  if(box.textContent.indexOf(line) < 0) box.textContent += (box.textContent ? "\n" : "") + line;
}

/** @returns {Db} 初期状態の db */
function blank(){

    contexts:["@PC","@電話","@外出","@打合せ","@自宅"],
    review:{last:null, history:[]}};

/* ---- データ形状のマイグレーション ----
   db.version を見て、段階的に古い形状を現行形状へ引き上げる。
   MIGRATIONS[v] は「v-1 から v への1段分」の補完処理で、欠けているフィールドだけを埋める
   （既存の値は上書きしない＝旧データ互換）。version フィールドが無い旧データは 0 として扱う。
   新しいフィールドを追加するときは、ここに MIGRATIONS[MODEL_VERSION+1] を足して
   MODEL_VERSION をインクリメントする（既存の分岐はそのまま残す）。 */
const MODEL_VERSION = 2;
const MIGRATIONS = {
  /* 0 → 1: 元々の normalize() が場当たり的にやっていた欠損補完をそのまま移した段。 */
  1: d => {
    if(!d.contexts) d.contexts = blank().contexts;
    if(!d.projects) d.projects = [];
    if(!d.review) d.review = {last:null, history:[]};
    if(!d.templates) d.templates = [];
    if(!d.appName) d.appName = "みなも";
    if(d.appTag == null) d.appTag = "MIND LIKE WATER";
  },
  /* 1 → 2: 「今日やる」印（#6）。既存項目に flagged が無ければ null で補う。 */
  2: d => {
    d.items.forEach(i => { if(i.flagged === undefined) i.flagged = null; });
  }
};

/** db（グローバル）を現行バージョンまで段階的に補完する。既存データを壊さない。 */
function normalize(){
  let v = db.version || 0;
  while(v < MODEL_VERSION){
    v++;
    if(MIGRATIONS[v]) MIGRATIONS[v](db);
  }
  db.version = MODEL_VERSION;
}

/* ---------- 世代バックアップ（起動時、1日1回） ---------- */
const BAK_KEY = KEY + ".bak";
const BAK_AT_KEY = KEY + ".bak.at";

/* bakAt が今日の日付でなければ退避すべき。null / 不正値でも true。
   テストのために純関数として切り出す。 */
function shouldRotateBackup(bakAt, todayStr){
  return bakAt !== todayStr;
}

/* raw（読めることが確認済みの生文字列）をそのまま .bak に退避する。
   normalize() 等の影響を受けないよう、必ず normalize() 前の文字列を渡すこと。
   失敗しても何も起きない（.bak.at を更新しない＝次回起動で再試行）。 */
function rotateBackup(s, raw){
  try{
    const at = s.getItem(BAK_AT_KEY);
    if(!shouldRotateBackup(at, today())) return;
    s.setItem(BAK_KEY, raw);
    s.setItem(BAK_AT_KEY, today());
  }catch(e){ /* 失敗しても何も起きない */ }
}

/* 退避の内容を {json, at, count} で返す。無い/読めない/parse失敗は null。 */
function readBackup(){
  const s = store();
  if(!s) return null;
  let json = null, at = null;
  try{ json = s.getItem(BAK_KEY); at = s.getItem(BAK_AT_KEY); }catch(e){ return null; }
  if(!json || !at) return null;
  try{
    const d = JSON.parse(json);
    if(!d || !Array.isArray(d.items)) return null;
    return {json, at, count: d.items.length};
  }catch(e){ return null; }
}

function load(){
  db = blank();
  const s = store();
  ui.storeOK = !!s;
  if(!s) return;
  let raw = null;
  try{ raw = s.getItem(KEY); }catch(e){ ui.storeOK = false; return; }
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.items)) db = d;
    else throw new Error("形式が不正");
  }catch(e){
    const bak = readBackup();
    const bakNote = bak ? `　退避（${fmtDate(bak.at)} 時点・${bak.count}件）があります。設定画面から戻せます。` : "";
    showError("保存データ", "前回の保存データを読めませんでした（" + (e.message||e) + "）。空の状態で開始します。上書き保存される前に、必要なら書き出しでバックアップしてください。" + bakNote);
    return;
  }
  rotateBackup(s, raw);
  normalize();
}

function haystack(i){
  const p = i.project ? prj(i.project) : null;
  return [i.title, i.note, i.who, i.context, p && p.name, p && p.outcome]
    .filter(Boolean).join(" ").toLowerCase();

/* isToday(i): 「今日やる」印が今日付いているか。
   flagged は「印を付けた日」の文字列なので、日付が変われば自然に false になる
   （掃除処理は不要）。state==="next" もここで判定に含める。state が next 以外に
   変わった項目は flagged をそのまま残す（消しに行かない）ため、印を付けたまま
   いつか等へ送っても表示には出ず、next に戻ってきた当日なら再び出る。 */
function isToday(i){
  return i.state==="next" && i.flagged===today();
}
const todayItems = () => db.items.filter(isToday);

/* ---- カーソル（j/k キー操作） ---- */
/* orderedIds(view): listGroups(view) の「画面に出る順序そのもの」を id の配列に平らにしたもの。
   j/k の移動順序は必ずこれを出所にする（renderList() の描画順とズレさせないため）。 */
function orderedIds(view){
  return listGroups(view).flatMap(g => g.items.map(i => i.id));
}
/* moveCursor(ids, cur, delta): 描画に依存しない純関数。
   cur が ids に無い id のとき（該当なし・null 含む）は先頭から数える。
   先頭で delta=-1 / 末尾で delta=+1 は動かさない（巻き戻さない）。
   ids が空のときは null。 */
function moveCursor(ids, cur, delta){
  if(!ids.length) return null;
  const ix = ids.indexOf(cur);
  if(ix < 0) return ids[0];
  const next = ix + delta;
  if(next < 0 || next >= ids.length) return ids[ix];
  return ids[next];
}

function lastDateOf(y,m){ return new Date(y, m+1, 0).getDate(); }
/* その日が対象日か。月末指定（31日など）は、その月の末日に丸める */
function tplHits(t, dateStr){
  const d = new Date((dateStr||today()) + "T00:00:00");
  if(t.cycle==="daily") return true;
  if(t.cycle==="weekly") return (t.weekdays||[]).indexOf(d.getDay()) >= 0;
  if(t.cycle==="monthly"){
    const want = +t.monthday || 1, last = lastDateOf(d.getFullYear(), d.getMonth());
    return d.getDate() === Math.min(want, last);
  }
  return false;
}
const tplDue     = t => tplHits(t);
const tplRanToday= t => t.lastRun === today();
const tplPending = () => db.templates.filter(t => tplDue(t) && !tplRanToday(t));
/* 次に該当する日（カレンダー投入用）。見つからなければ今日 */
function tplNextDate(t){
  if(t.cycle==="adhoc" || t.cycle==="daily") return today();
  const base = new Date(today()+"T00:00:00");
  for(let k=0;k<400;k++){
    const d = new Date(base); d.setDate(base.getDate()+k);
    const ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(tplHits(t, ds)) return ds;
  }
  return today();
}
function cycleLabel(t){
  if(t.cycle==="weekly"){
    const w = (t.weekdays||[]).slice().sort().map(x => WD[x]).join("・");
    return "毎週 " + (w || "未指定");
  }
  if(t.cycle==="monthly") return "毎月 " + (+t.monthday || 1) + "日";
  return CYCLES[t.cycle] || "随時";
}
function tplRun(t){
  const a = newItem(t.title);
  a.note = t.note || ""; a.context = t.context || ""; a.minutes = +t.minutes || 0;
  a.energy = t.energy || ""; a.project = t.project || null; a.tpl = t.id;
  if(t.target==="calendar"){ a.state = "calendar"; a.due = tplNextDate(t); }
  else a.state = "next";
  db.items.push(a);
  t.lastRun = today();
  return a;
}

/* ==== src/js/07-html.js ==== */
/* =========================================================
   自動エスケープする html`` テンプレートタグ（Phase 6）

   通常のテンプレートリテラルは埋め込んだ値をそのまま文字列化するため、
   HTML に差し込む箇所ごとに esc() を手で呼ぶ必要があった（呼び忘れると
   そのまま XSS になる）。html`` タグ付きテンプレートは、${...} に
   埋め込んだ値を renderValue() 経由で自動的にエスケープすることで、
   「埋め込みは自動で安全」をデフォルトにする。

   埋め込み値の扱い:
   - null / undefined            → 空文字
   - 配列                        → 各要素を renderValue() した上で連結（join("")）
                                    ＝ .map(...).join("") で作った部分HTML片の配列を
                                    そのまま渡せる
   - raw() で包んだ値            → エスケープせずそのまま埋め込む（信頼できる、
                                    すでに構築済みの HTML 断片を差し込むときだけ使う）
   - それ以外（文字列・数値等）  → esc() で文字列化＋エスケープ
   ========================================================= */
function renderValue(v){
  if(v == null) return "";
  if(Array.isArray(v)) return v.map(renderValue).join("");
  if(v && typeof v === "object" && Object.prototype.hasOwnProperty.call(v, "__raw")) return v.__raw;
  return esc(v);
}
function html(strings, ...vals){
  return strings.reduce((acc, s, i) => acc + s + (i < vals.length ? renderValue(vals[i]) : ""), "");
}
/** すでに安全と分かっている（自分で構築した）HTML文字列をエスケープせず埋め込む。
    esc() 済みの断片や、html`` で作った部分HTML片を差し込むときに使う。 */
const raw = s => ({__raw: String(s)});

/* ==== src/js/08-undo.js ==== */
/* =========================================================
   取り消し（Undo）— db 丸ごとのスナップショット方式

   差分方式ではなく db 全体を JSON 文字列でコピーする。db は数百KB規模で、
   丸ごとコピーで十分速く、差分方式に比べて実装ミスの余地が桁違いに小さい。

   保持は最大10件のスタック。それを超えたら古い方から捨てる。

   DOM に触る関数（snapshot / undoLast / showToast）と
   触らない関数（pushUndo / popUndo / undoDepth / resetUndo）を必ず分ける。
   テストは後者だけを対象にする。
   ========================================================= */
const UNDO_MAX = 10;
let undoStack = [];

/* 現在の db を JSON 文字列にしてスタックへ積む。
   JSON.stringify した文字列で保持し、取り出すたびに JSON.parse し直すことで、
   push した後に db が変更されても積んだ内容に影響しない（深いコピー）。
   最大 UNDO_MAX 件を超えたら、最も古いものから捨てる。 */
function pushUndo(label){
  undoStack.push({label, json: JSON.stringify(db)});
  if(undoStack.length > UNDO_MAX) undoStack.shift();
}
/* 直近のスナップショットを取り出して db オブジェクトへ戻して返す。無ければ null。 */
function popUndo(){
  const top = undoStack.pop();
  if(!top) return null;
  return JSON.parse(top.json);
}
/* スタックの深さ。 */
function undoDepth(){
  return undoStack.length;
}
/* スタックを空にする（テスト用）。 */
function resetUndo(){
  undoStack = [];
}

/* pushUndo() + トースト表示。呼び出し側は「変更が確定する直前」
  （早期 return や ask() のキャンセルより後）でこれを呼ぶ。 */
function snapshot(label){
  pushUndo(label);
  showToast(label, {undo:true});
}
/* 直近のスナップショットへ db を差し替えて保存・再描画する。 */
function undoLast(){
  const restored = popUndo();
  if(!restored) return;
  db = restored;
  normalize(); save(); closePanel(); renderAll();
  showToast("取り消しました", {undo:false});
}

let toastTimer = null;
/* トーストの表示（8秒で自動的に消える）。
   opts.undo が true のときだけ「取り消す」ボタン（[data-undo]）を出す。
   取り消し不可の通知にも使えるよう、ボタンの有無をここで切り替えられるようにしておく
  （#5 の布石。今回は undo:true の場合しか使わない）。 */
function showToast(msg, opts){
  opts = opts || {};
  const t = $("#toast");
  if(!t) return;
  t.innerHTML = html`<span class="toast-msg">${msg}</span>${opts.undo ? raw('<button class="toast-undo" data-undo>取り消す</button>') : ""}`;
  t.classList.remove("hide");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hide"), 8000);
}

/* 検索対象：本文・メモ・待ち相手・コンテキスト・所属プロジェクト（名称と望む結果） */

/* listGroups(view): 画面に出る順序そのものを [{label, items}, ...] で返す純関数。
   renderList() の描画と j/k カーソルの移動順序の、両方の出所をこれ1つに揃える
   （「次のアクション」ビューはコンテキスト別グループ化で見た目の順序が
   items 配列そのままの順序と一致しないため、別々に組み立てると j/k が画面とずれる）。
   label が null のグループはグループ見出しを描かないビュー全体を表す。 */
function listGroups(view){
  const v = view;
  let items;
  if(v.startsWith("ctx:")){
    const c = v.slice(4);
    items = db.items.filter(i => i.state==="next" && i.context===c);
  }else if(v==="today"){
    items = todayItems();
  }else{
    items = db.items.filter(i => i.state===v);
  }

  if(v==="next" || v.startsWith("ctx:")){
    if(ui.min) items = items.filter(i => i.minutes && i.minutes <= ui.min);
    if(ui.energy) items = items.filter(i => i.energy===ui.energy);
  }
  items = visible(items);

  if(v==="calendar") items.sort((a,b) => (a.due||"9") < (b.due||"9") ? -1 : 1);
  else if(v==="done") items.sort((a,b) => (b.doneAt||"") < (a.doneAt||"") ? -1 : 1);
  else if(v==="waiting") items.sort((a,b) => (a.since||"") < (b.since||"") ? -1 : 1);
  else items.sort((a,b) => a.created < b.created ? -1 : 1);

  if(v==="next"){
    const groups = {};
    items.forEach(i => { const k = i.context || "（コンテキスト未設定）"; (groups[k] = groups[k] || []).push(i); });
    return Object.keys(groups).sort().map(k => ({label: k, items: groups[k]}));
  }
  return [{label: null, items}];
}

function renderList(){
  const L = $("#list");
  const v = ui.view;

  if(v==="projects"){ renderProjects(); return; }
  if(v==="routines"){ renderRoutines(); return; }

  let title = STATES[v] ? STATES[v].t : v, sub = STATES[v] ? STATES[v].sub : "";
  if(v.startsWith("ctx:")){
    const c = v.slice(4);
    title = c; sub = "このコンテキストで今できること";
  }else if(v==="today"){
    title = "今日やる"; sub = "その日のうちにやると決めたもの";
  }
  $("#vTitle").textContent = title;
  $("#vSub").textContent = ui.q ? `「${ui.q}」で絞り込み中` : sub;

  const groups = listGroups(v);
  const items = groups.flatMap(g => g.items);
  if(ui.cur && !items.some(i => i.id===ui.cur)) ui.cur = null;

  if(!items.length){ L.innerHTML = emptyHTML(v); return; }

  if(v==="next"){
    L.innerHTML = groups.map(g =>
      html`<div class="grp">${g.label} <span>${g.items.length}</span></div>` +
      g.items.map(rowHTML).join("")).join("");
  }else{
    L.innerHTML = items.map(rowHTML).join("");
  }
}
function rowHTML(i){
  const tags = [];
  if(i.context) tags.push(html`<span class="tag ctx">${i.context}</span>`);
  if(i.project && prj(i.project)) tags.push(html`<span class="tag prj">◆ ${prj(i.project).name}</span>`);
  if(i.who) tags.push(html`<span class="tag wait">${i.who} 待ち / ${daysSince(i.since||i.created)}日</span>`);
  if(i.due) tags.push(html`<span class="tag ${i.due < today() && i.state!=="done" ? "over" : "due"}">${fmtDate(i.due)}</span>`);
  if(i.minutes) tags.push(html`<span class="tag">${i.minutes}分</span>`);
  if(i.energy) tags.push(html`<span class="tag">${i.energy==="high"?"高":"低"}エネ</span>`);
  if(i.state==="next" && daysSince(i.updated) >= 14) tags.push(html`<span class="tag stale">${daysSince(i.updated)}日 停滞</span>`);
  if(i.state==="done" && i.doneAt) tags.push(html`<span class="tag">${fmtDate(i.doneAt)} 完了</span>`);
  /* 「今日やる」印の付け外しボタンは、押すことに意味があるビュー
     （次のアクション・コンテキスト別・今日やる）でのみ出す。 */
  const showFlag = ui.view==="next" || ui.view.startsWith("ctx:") || ui.view==="today";
  const flagBtn = showFlag
    ? html`<button class="flag ${isToday(i)?"on":""}" data-flag="${i.id}" aria-label="今日やる印">★</button>`
    : "";
  /* tags は既に html`` でエスケープ済みの断片配列。そのまま join した文字列を
     raw() で包み、外側テンプレートで二重エスケープしないようにする。 */
  return html`<div class="row ${i.state==="done"?"done":""} ${ui.sel===i.id?"sel":""} ${ui.cur===i.id?"cur":""}" data-id="${i.id}">
    <button class="tick" data-tick="${i.id}" aria-label="完了にする"></button>
    <div class="row-body"><span class="row-t">${i.title}</span>
      ${tags.length?raw(`<div class="meta">${tags.join("")}</div>`):""}</div>
    ${raw(flagBtn)}
  </div>`;
}
function emptyHTML(v){
  const M = {
    inbox:["水面","収集トレイは空です","浮かんだことは上の欄に書いて Enter。判断はあとでまとめてやります。"],
    next:["→","次のアクションがありません","収集トレイの項目を明確化すると、ここに具体的な一手が並びます。"],
    today:["★","今日やる印がありません","次のアクションの一覧で t を押すと、その日の予定に引き上げられます。"],
    waiting:["…","誰にも預けていません","自分でやらない仕事は、明確化のときに「待ち」へ送ります。"],
    calendar:["▣","日付指定のものはありません","その日でなければ意味がないものだけを、ここに置きます。"],
    someday:["○","いつかリストは空です","今はやらないが捨てたくないものを退避させておく場所です。"],
    reference:["▤","資料はありません","行動不要で、あとで見返すものを保管します。"],
    done:["✓","完了した項目はまだありません","片づいたものはここに積み上がります。"],
    projects:["◆","プロジェクトがありません","2つ以上の行動が必要なものは、明確化のときにプロジェクトにします。"],
    routines:["◈","定型がありません","繰り返し発生する作業を登録しておくと、クリック1回で投入できます。"]
  };
  const m = M[v] || M.inbox;
  return `<div class="empty"><span class="mk">${m[0]}</span><h3>${m[1]}</h3><p>${m[2]}</p></div>`;
}

function readTplForm(){

const TREE = {
  q1:{q:"これは、行動が必要なもの？", hint:"必要ないなら、捨てるか・残すかを決めます。",
      opts:[
        {t:"行動が必要", s:"はい", go:"q2"},
        {t:"資料として残す", s:"いいえ・残す", act:"reference"},
        {t:"いつか / たぶん", s:"いいえ・保留", act:"someday"},
        {t:"捨てる", s:"いいえ・破棄", act:"trash"}
      ]},
  q2:{q:"2分以内で終わる？", hint:"終わるなら、いま片づけるのが最短です。",
      opts:[{t:"いま片づけた（完了にする）", s:"はい", act:"done"},{t:"2分では終わらない", s:"いいえ", go:"q3"}]},
  q3:{q:"自分がやるべき？", hint:"人に任せるなら、誰に預けたかを記録します。",
      opts:[{t:"自分でやる", s:"はい", go:"q4"},{t:"人に任せる", s:"いいえ", form:"waiting"}]},
  q4:{q:"1回の行動で終わる？", hint:"2つ以上の行動が要るならプロジェクトです。",
      opts:[{t:"1回の行動で終わる", s:"はい", go:"q5"},{t:"複数の行動が必要", s:"いいえ", form:"project"}]},
  q5:{q:"特定の日にやる？", hint:"その日でなければ意味がないものだけカレンダーへ。",
      opts:[{t:"日付が決まっている", s:"はい", form:"calendar"},{t:"手が空いたときにやる", s:"いいえ", form:"next"}]}
};

function openClarify(id){
  ui.sel = id; ui.clar = {step:"q1", path:[]};
  showPanel(); renderAll();
}
function renderClarify(){
  const it = item(ui.sel); if(!it) return closePanel();
  /* renderClarify() は renderPanel() が「ui.clar が真のときだけ」呼ぶため、
     通常の描画経路では ui.clar は必ず存在する。ここでのガードは通常系の
     見た目を一切変えず、それ以外の経路から誤って呼ばれた場合の保険として
     #eTpl / #fBack と同じ構えを揃えるためのもの。 */
  if(!ui.clar) return closePanel();
  $("#pTitle").textContent = "明確化";
  const past = raw(ui.clar.path.map(p =>
    html`<div class="step past"><div class="q">${TREE[p.k].q}<span class="ans">${p.s}</span></div></div>`).join(""));

  let cur;
  if(ui.clar.form){
    cur = raw(formHTML(ui.clar.form, it));
  }else{
    const n = TREE[ui.clar.step];
    const opts = raw(n.opts.map((o,ix) =>
      html`<button class="opt" data-opt="${ix}">${o.t}</button>`).join(""));
    cur = raw(html`<div class="step now">
      <div class="q">${n.q}</div><div class="hint">${n.hint}</div>
      <div class="opts">${opts}</div></div>`);
  }
  $("#pBody").innerHTML = html`<div class="subj">${it.title}</div>
     <div class="clar">${past}${cur}</div>
     <div class="p-acts">
       <button class="btn sm" id="clarRestart">最初からやり直す</button>
       <button class="btn sm" id="clarEdit">項目を直接編集</button>
     </div>`;
}
/* formHTML() は既にエスケープ済みのHTML文字列を返す（呼び出し側 renderClarify() で raw() 済み）。 */
function formHTML(kind, it){
  const ctxOpts = raw(db.contexts.map(c => html`<option value="${c}">${c}</option>`).join(""));
  const prjOpts = raw(db.projects.filter(p => p.status==="active")
    .map(p => html`<option value="${p.id}">${p.name}</option>`).join(""));
  const minOpts = raw(MIN_OPT.map(([m,l]) => html`<option value="${m}">${l}</option>`).join(""));
  const common = html`
    <div class="f2">
      <div class="f"><label>所要時間の目安</label><select id="fMin">${minOpts}</select></div>
      <div class="f"><label>エネルギー</label><select id="fEne">
        <option value="">—</option><option value="high">高い</option><option value="low">低い</option></select></div>
    </div>
    <div class="f"><label>関連プロジェクト</label><select id="fPrj">
      <option value="">なし</option>${prjOpts}</select></div>`;

  if(kind==="waiting") return html`<div class="step now">
    <div class="q">誰に預けた？</div>
    <div class="f" style="margin-top:9px"><label>相手</label><input id="fWho" placeholder="例：田中さん / 情シス"></div>
    <div class="f"><label>依頼した日</label><input type="date" id="fSince" value="${today()}"></div>
    <div class="f"><label>次の一手（自分の待ち方）</label><input id="fTitle" value="${it.title}"></div>
    <div class="f"><label>関連プロジェクト</label><select id="fPrj"><option value="">なし</option>${prjOpts}</select></div>
    <div class="p-acts"><button class="btn primary" id="fSave">待ちリストへ</button>
      <button class="btn" id="fBack">戻る</button></div></div>`;

  if(kind==="calendar") return html`<div class="step now">
    <div class="q">いつやる？</div>
    <div class="f" style="margin-top:9px"><label>日付</label><input type="date" id="fDue" value="${today()}"></div>
    <div class="f"><label>行動（動詞で書く）</label><input id="fTitle" value="${it.title}"></div>
    ${raw(common)}
    <div class="p-acts"><button class="btn primary" id="fSave">カレンダーへ</button>
      <button class="btn" id="fBack">戻る</button></div></div>`;

  if(kind==="next") return html`<div class="step now">
    <div class="q">次の一手は？</div>
    <div class="hint">「〜に電話する」「〜のたたきを書く」のように、迷わず手が動く形にします。</div>
    <div class="f" style="margin-top:9px"><label>行動</label><input id="fTitle" value="${it.title}"></div>
    <div class="f"><label>コンテキスト（どこで・何があればできるか）</label>
      <select id="fCtx"><option value="">未設定</option>${ctxOpts}</select></div>
    ${raw(common)}
    <div class="p-acts"><button class="btn primary" id="fSave">次のアクションへ</button>
      <button class="btn" id="fBack">戻る</button></div></div>`;

  if(kind==="project") return html`<div class="step now">
    <div class="q">望む結果は？</div>
    <div class="hint">終わったと言える状態を先に決めてから、最初の一手を書きます。</div>
    <div class="f" style="margin-top:9px"><label>プロジェクト名</label><input id="fPName" value="${it.title}"></div>
    <div class="f"><label>望む結果（完了の定義）</label><textarea id="fOut" placeholder="例：新ツールの運用手順書が部内に配布され、質問が来ない状態"></textarea></div>
    <div class="f"><label>最初の次の一手</label><input id="fFirst" placeholder="例：現行手順の画面キャプチャを集める"></div>
    <div class="f"><label>その一手のコンテキスト</label>
      <select id="fCtx"><option value="">未設定</option>${ctxOpts}</select></div>
    <div class="p-acts"><button class="btn primary" id="fSave">プロジェクトを作る</button>
      <button class="btn" id="fBack">戻る</button></div></div>`;
  return "";
}
function clarChoose(ix){
  /* [data-opt] ボタンは明確化フローの選択肢表示中しか存在しないが、
     ui.clar が外れた状態で呼ばれても例外を投げないようにしておく。 */
  if(!ui.clar) return;
  const n = TREE[ui.clar.step], o = n.opts[ix], it = item(ui.sel);
  ui.clar.path.push({k:ui.clar.step, s:o.s});
  if(o.go){ ui.clar.step = o.go; renderAll(); return; }
  if(o.form){ ui.clar.form = o.form; renderAll(); return; }
  if(o.act==="trash"){ db.items = db.items.filter(x => x.id!==it.id); }
  else if(o.act==="done"){ it.state = "done"; it.doneAt = today(); it.updated = today(); }
  else { it.state = o.act; it.updated = today(); }
  save(); closePanel(); renderAll();
}
function clarSubmit(){
  /* #fSave も明確化フローのフォーム表示中しか存在しないが、同様にガードしておく。 */
  if(!ui.clar) return;
  snapshot("明確化");
  const it = item(ui.sel), k = ui.clar.form;
  const val = id => { const el = $("#"+id); return el ? el.value.trim() : ""; };
  if(k==="waiting"){
    it.title = val("fTitle") || it.title; it.who = val("fWho") || "先方";
    it.since = val("fSince") || today(); it.project = val("fPrj") || null; it.state = "waiting";
  }else if(k==="calendar"){
    it.title = val("fTitle") || it.title; it.due = val("fDue") || today();
    it.minutes = +val("fMin") || 0; it.energy = val("fEne"); it.project = val("fPrj") || null; it.state = "calendar";
  }else if(k==="next"){
    it.title = val("fTitle") || it.title; it.context = val("fCtx");
    it.minutes = +val("fMin") || 0; it.energy = val("fEne"); it.project = val("fPrj") || null; it.state = "next";
  }else if(k==="project"){
    const p = {id:uid(), name:val("fPName") || it.title, outcome:val("fOut"), status:"active", created:today()};
    db.projects.push(p);
    const first = val("fFirst");
    if(first){
      const a = newItem(first); a.state = "next"; a.context = val("fCtx"); a.project = p.id;
      db.items.push(a);
    }
    db.items = db.items.filter(x => x.id!==it.id);
    save(); closePanel(); ui.view = "projects"; renderAll(); return;
  }
  it.updated = today();
  save(); closePanel(); renderAll();
}

  {t:"止まっているプロジェクトを動かす", lead:"次の一手が登録されていないプロジェクトは、事実上止まっています。",
   getP:() => db.projects.filter(p => p.status==="active" && projectNeedsAction(p)),
   ok:"すべてのプロジェクトに次の一手があります。", jump:"projects"},
  {t:"停滞したアクションを見直す", lead:"2週間以上動いていない一手です。粒度が大きすぎないか確認します。",
   get:staleNext, ok:"停滞している一手はありません。", jump:"next",
   acts:["done","someday","today"]},
  {t:"いつかリストを棚卸しする", lead:"今週から動かすものがあれば、次のアクションに引き上げます。",
   get:() => db.items.filter(i => i.state==="someday"), ok:"いつかリストは空です。", jump:"someday",
   acts:["done","next","today"]}
];

const REVIEW_ACT_LABEL = {done:"完了", someday:"いつかへ", next:"次へ", today:"今日"};

/* applyReviewAct(it, act): レビュー行内操作の状態遷移そのもの。
   引数の item を書き換えるだけの純関数（save も描画もしない）。
   today は state も "next" にする。isToday() が state==="next" を条件に
   含むため、いつか等の項目に印だけ付けても「今日やる」ビューに出てこない。
   一体で state を next に上げることで、その場で「今日やる」に反映される。 */
function applyReviewAct(it, act){
  if(act==="done"){ it.state = "done"; it.doneAt = today(); it.updated = today(); }
  else if(act==="someday"){ it.state = "someday"; it.updated = today(); }
  else if(act==="next"){ it.state = "next"; it.updated = today(); }
  else if(act==="today"){ it.state = "next"; it.flagged = today(); }
  return it;
}

function openReview(){ ui.review = 0; renderReview(); }
function renderReview(){
  if(ui.review===null){ $("#overlay").innerHTML = ""; return; }
  const last = ui.review >= REVIEW.length;
  let body, foot;

  if(last){
    const c = counts();
    body = html`<h4>レビュー完了</h4>
      <p class="lead">今週のリストは信頼できる状態になりました。実施日を記録します。</p>
      <div class="rv-list">
        <div class="rv-item"><span class="sp">次のアクション</span><span class="tag">${c.next}</span></div>
        <div class="rv-item"><span class="sp">待ち</span><span class="tag">${c.waiting}</span></div>
        <div class="rv-item"><span class="sp">進行中プロジェクト</span><span class="tag">${c.projects}</span></div>
        <div class="rv-item"><span class="sp">収集トレイの残り</span><span class="tag">${c.inbox}</span></div>
      </div>`;
    foot = html`<button class="btn" data-rv="prev">戻る</button><span style="flex:1"></span>
      <button class="btn primary" data-rv="finish">レビュー完了を記録</button>`;
  }else{
    const s = REVIEW[ui.review];
    const rows = s.getP ? s.getP() : s.get();
    const rowsHTML = rows.map(r => {
      const isP = !!s.getP;
      const meta = isP ? "次の一手なし"
        : (r.who ? html`${r.who} / ${daysSince(r.since||r.created)}日`
          : r.due ? fmtDate(r.due)
          : r.state==="next" ? `${daysSince(r.updated)}日 停滞` : "");
      const actsHTML = (s.acts||[]).map(act =>
        html`<button class="btn sm" data-rvact="${act}" data-rvid="${r.id}">${REVIEW_ACT_LABEL[act]}</button>`
      ).join("");
      return html`<div class="rv-item"><span class="sp">${isP ? r.name : r.title}</span>
          ${meta?raw(html`<span class="tag">${raw(meta)}</span>`):""}
          <span class="rv-acts">${raw(actsHTML)}<button class="btn sm" data-rvopen="${r.id}" data-rvp="${isP?1:0}">開く</button></span></div>`;
    }).join("");
    body = html`<h4>${s.t}</h4><p class="lead">${s.lead}</p>${
      rows.length ? raw(html`<div class="rv-list">${raw(rowsHTML)}</div>`) : raw(html`<div class="rv-ok">${s.ok}</div>`)}`;
    foot = html`<button class="btn" data-rv="prev" ${ui.review===0?"disabled":""}>戻る</button>
      <button class="btn sm" data-rv="jump">このビューを開く</button>
      <span style="flex:1"></span>
      <span class="sub" style="font-family:var(--f-mono);font-size:10px;color:var(--ink3)">${ui.review+1} / ${REVIEW.length}</span>
      <button class="btn primary" data-rv="next">確認した</button>`;
  }
  const bars = raw(REVIEW.map((_,ix) => html`<i class="${ix < ui.review ? "done" : ix===ui.review ? "on" : ""}"></i>`).join(""));
  $("#overlay").innerHTML = html`<div class="ov" data-ovbg="1"><div class="sheet">
    <div class="sheet-head"><h3>週次レビュー</h3>
      <p>頭の中ではなくリストを信頼するための、週に一度の点検</p>
      <div class="prog">${bars}<i class="${last?"on":""}"></i></div></div>
    <div class="sheet-body">${raw(body)}</div>
    <div class="sheet-foot">${raw(foot)}<button class="btn" data-rv="close" style="margin-left:8px">中断</button></div>
  </div></div>`;
}

/* ==== src/js/30-actions.js ==== */
/* =========================================================
   アクション — 状態を変更する処理に名前を付けたもの
   （旧: document click / input / change ×2 / keydown ハンドラの
    各 if 分岐の中身を、そのまま名前付き関数へ移したもの。
    ロジックは変更していない。分岐内でイベント要素の dataset を
    直接読んでいた箇所は、呼び出し側（40-events.js）が読んで
    引数として渡す形に置き換えている＝束縛の変更のみ）

   ---- 描画呼び出しの方針（Phase 5） ----
   各アクションは、状態を変えたら原則 renderAll() で描き直す（部分描画の手選びをやめ、
   「選び忘れ＝画面が古いまま」というバグ源を無くす）。全再描画のコストは無視できる規模。
   renderPanel() はパネル未選択（!ui.sel）なら即 return するだけなので、パネルが
   閉じている状態で renderAll() を呼んでも無害。

   例外（部分描画のまま。理由付きでここに列挙する）:
   1. addContextNew（#ctxNew 連続追加）— renderPanel() が #pBody を丸ごと
      innerHTML で作り直すため、renderAll() にすると入力欄 #ctxNew 自体が
      毎回作り直され、Enter で連続追加している最中にフォーカスが失われる。
      現状どおり renderRail()+renderPanel() の後に明示的に #ctxNew を
      再フォーカスする形を維持する。
   2. addProjectAction（#pAdd プロジェクト内の行動追加）— 同上の理由
      （renderPanel() が #pAdd を含む #pBody を作り直す）。renderAll() にすると
      連続で行動を Enter 追加している最中にフォーカスが飛ぶ。
   3. changeTemplateCycle（#tCycle 定型の周期変更）— こちらは renderPanel() 経由
      ではなく直接 renderTplForm() を呼ぶ元のコードのままだが、同じ理由（周期を
      変えるたびに #pBody 全体を再構築するため、renderAll() にしても renderPanel()
      にしても #tCycle 自体は毎回作り直される）で全体再描画に寄せる意味がなく、
      むしろ renderList()/renderFilters() 分の無駄な再構築が増えるだけなので、
      元のとおり renderTplForm() だけを呼ぶ最小描画のままにする。
   4.（当初の3例外に加えて Phase 5 のブラウザ確認で見つけた4件目）
      setSearchQuery（絞り込みバーの検索入力 #qIn）— renderFilters() は #filters を
      丸ごと innerHTML で作り直し #qIn 自体を新しい要素に置き換えるため、
      renderAll()（renderFilters() を含む）にすると検索語を1文字打つたびに
      入力欄からフォーカスが外れ、連続入力ができなくなる。renderList() だけを
      呼ぶ元の実装を維持する。
   ========================================================= */

function moveContext(ix, d){
  const to = ix + d;
  if(to >= 0 && to < db.contexts.length){
    const a = db.contexts;
    const tmp = a[ix]; a[ix] = a[to]; a[to] = tmp;
    save(); renderAll();
  }
}
function deleteContext(ix){

/* レビュー行内の操作（完了・いつかへ・次へ・今日）で使う取り消し履歴のラベル。
   行のボタン表示（REVIEW_ACT_LABEL、18-view-review.js）とは別に持つ
   （ボタンは短く「完了」、トーストは動作が分かる「完了にする」）。 */
const REVIEW_ACT_SNAPSHOT_LABEL = {
  done:"完了にする", someday:"いつかへ送る", next:"次のアクションへ", today:"今日やる印"
};
/* レビュー行内の操作（完了・いつかへ・次へ・今日）。状態遷移そのものは
   applyReviewAct（18-view-review.js の純関数）に切り出してある。ここでは
   その前後の取り消し履歴・保存・再描画だけを担う。オーバーレイは閉じず、
   renderReview() でその節を描き直す（対象から外れた行は自然に消える）。 */
function reviewAct(id, act){
  const it = item(id);
  if(!it) return;
  snapshot(REVIEW_ACT_SNAPSHOT_LABEL[act] || "レビューの操作");
  applyReviewAct(it, act);
  save(); renderReview(); renderRail();
}

/* ---- コンテキスト改名（change） ---- */
function renameContext(el, ix){
  const before = db.contexts[ix], after = el.value.trim();
  if(after===before) return;
  if(!after){ tell("空の名前にはできません。削除する場合は × を使ってください。"); el.value = before; return; }
  if(db.contexts.some((c,j) => j!==ix && c===after)){
    tell("同じ名前のコンテキストがすでにあります。"); el.value = before; return;
  }
  snapshot("コンテキスト名の変更");
  db.contexts[ix] = after;
  db.items.forEach(i => { if(i.context===before) i.context = after; });
  if(ui.view==="ctx:"+before) ui.view = "ctx:"+after;
  save(); renderAll();
}

/* ---- キー操作（keydown） ---- */
function addContextNew(el){

function addProjectAction(el){
  const v = el.value.trim(); if(!v) return;

  db.items.push(a); save(); renderPanel(); renderRail();
  /* renderPanel() が #pAdd ごと作り直すためフォーカスが外れる。
     行動は続けて何件も足すことが多いので、収集欄(capture)や
     コンテキスト追加(addContextNew)と同じく入力欄へ戻す。
     作り直された後の要素を引き直す必要があるため el は使えない。 */
  const f = $("#pAdd"); if(f) f.focus();
}
function triggerTemplateCardClick(e, card){
  e.preventDefault(); card.dispatchEvent(new MouseEvent("click",{bubbles:true}));
}
function dismissActive(){
  if(ui.review!==null){ ui.review = null; renderReview(); }
  else if(ui.sel){ closePanel(); renderAll(); }
}
function focusCapture(e){
  e.preventDefault(); $("#capIn").focus();
}
function focusSearch(e){
  const q = $("#qIn"); if(q){ e.preventDefault(); q.focus(); }
}

/* ==== src/js/40-events.js ==== */
/* =========================================================
   イベント配線 — セレクタ/条件 → アクション のルーティング表

   旧 click / input / change ×2 / keydown ハンドラは、約30個の if を
   上から順に評価し、最初に一致したものだけを実行して return していた。
   ここではその評価順序を1行もずらさず配列の並びとして写し、
   最初に一致したエントリだけを実行して打ち切る（旧 return と同義）。

   - `match(t)` は一致した要素（またはイベント）を返す。不一致なら falsy。
   - `stop:true` は旧コードの `e.stopPropagation()` に対応する
     （[data-tpledit] と [data-tick] の2箇所のみ）。
   - closest() によるマッチと t.id===/dataset 直接参照によるマッチが
     混在するため、match は「そのつど判定してマッチ対象を返す関数」にしている。
   ========================================================= */

function runRoutes(routes, e){
  for(const r of routes){
    const m = r.match(e);
    if(m){
      if(r.stop) e.stopPropagation();
      r.run(m, e);
      return true;
    }
  }
  return false;
}

const CLICK_ROUTES = [
  { match: e => e.target.closest("[data-open]"),
    run: () => openSettings() },

  { match: e => e.target.closest("[data-cmove]"),
    run: el => moveContext(+el.dataset.cmove, +el.dataset.dir) },

  { match: e => e.target.closest("[data-cdel]"),
    run: el => deleteContext(+el.dataset.cdel) },

  { match: e => e.target.id==="appSave" ? e.target : null,
    run: () => saveAppName($("#appName").value.trim(), $("#appTag").value.trim()) },

  { match: e => e.target.id==="bakRestore" ? e.target : null,
    run: () => restoreBackup() },

  { match: e => e.target.closest("[data-undo]"),
    run: () => undoLast() },

  /* ---- 定型 ---- */
  { match: e => e.target.closest("[data-tpledit]"), stop: true,
    run: el => openTemplateEditor(el.dataset.tpledit) },

  { match: e => e.target.closest("[data-tplrun]"),
    run: el => runTemplate(el.dataset.tplrun) },

  { match: e => e.target.id==="tplAllRun" ? e.target : null,
    run: () => runAllPendingTemplates() },

  { match: e => e.target.id==="tplNew" ? e.target : null,
    run: () => newTemplate() },

  { match: e => e.target.closest("[data-wd]"),
    run: el => toggleTemplateWeekday(+el.dataset.wd) },

  { match: e => (e.target.id==="tSave" || e.target.id==="tSaveRun") ? e.target : null,
    run: t => saveTemplate({run: t.id==="tSaveRun"}) },

  { match: e => e.target.id==="tDel" ? e.target : null,
    run: () => deleteTemplate() },

  { match: e => e.target.id==="eTpl" ? e.target : null,
    run: () => makeTemplateFromItem(ui.sel) },

  { match: e => e.target.closest("[data-view]"),
    run: el => switchView(el.dataset.view) },

  { match: e => e.target.closest("[data-tick]"), stop: true,
    run: el => toggleItemDone(el.dataset.tick) },

  { match: e => e.target.closest("[data-flag]"), stop: true,
    run: el => toggleTodayFlag(el.dataset.flag) },

  { match: e => e.target.closest("[data-id]"),
    run: el => selectItem(el.dataset.id) },

  { match: e => e.target.closest("[data-prj]"),
    run: el => selectProject(el.dataset.prj) },

  { match: e => e.target.closest("[data-min]"),
    run: el => setMinutesFilter(+el.dataset.min) },
  { match: e => e.target.closest("[data-energy]"),
    run: el => setEnergyFilter(el.dataset.energy) },

  { match: e => e.target.closest("[data-opt]"),
    run: el => chooseClarifyOption(+el.dataset.opt) },

  { match: e => e.target.id==="fSave" ? e.target : null,
    run: () => submitClarify() },
  { match: e => e.target.id==="fBack" ? e.target : null,
    run: () => backClarify() },
  { match: e => e.target.id==="clarRestart" ? e.target : null,
    run: () => restartClarify() },
  { match: e => e.target.id==="clarEdit" ? e.target : null,
    run: () => cancelClarify() },
  { match: e => e.target.id==="pClose" ? e.target : null,
    run: () => closePanelView() },

  /* 項目編集 */
  { match: e => e.target.id==="eSave" ? e.target : null,
    run: () => saveItemEdit() },
  { match: e => e.target.id==="eDone" ? e.target : null,
    run: () => completeItem() },
  { match: e => e.target.id==="eReopen" ? e.target : null,
    run: () => reopenItem() },
  { match: e => e.target.id==="eClar" ? e.target : null,
    run: () => startClarify() },
  { match: e => e.target.id==="eDel" ? e.target : null,
    run: () => deleteItem() },

  /* プロジェクト編集 */
  { match: e => e.target.id==="pSave" ? e.target : null,
    run: () => saveProject() },
  { match: e => e.target.id==="pDone" ? e.target : null,
    run: () => completeProject() },
  { match: e => e.target.id==="pDel" ? e.target : null,
    run: () => deleteProject() },

  /* 上部バー */
  { match: e => e.target.id==="btnExport" ? e.target : null,
    run: () => exportJSON() },
  { match: e => e.target.id==="btnImport" ? e.target : null,
    run: () => promptImport() },
  { match: e => e.target.id==="btnReview" ? e.target : null,
    run: () => openReview() },

  /* レビュー */
  { match: e => e.target.closest('[data-rv="next"]'),
    run: () => reviewNext() },
  { match: e => e.target.closest('[data-rv="prev"]'),
    run: () => reviewPrev() },
  { match: e => e.target.closest('[data-rv="close"]'),
    run: () => reviewClose() },
  { match: e => e.target.closest('[data-rv="jump"]'),
    run: () => reviewJump() },
  { match: e => e.target.closest('[data-rv="finish"]'),
    run: () => reviewFinish() },

  /* [data-rvact] はボタンが行の中（[data-rvopen] と同じ行）にあるため、
     [data-rvopen] より前に置く。closest() は最も近い一致要素まで DOM を
     遡って探すだけで、先に定義されたエントリが先に評価されるだけなので、
     順序を逆にすると data-rvact ボタンのクリックが data-rvopen 側に
     吸われてしまう（実際の行の HTML 構造は 18-view-review.js 参照）。 */
  { match: e => e.target.closest("[data-rvact]"),
    run: el => reviewAct(el.dataset.rvid, el.dataset.rvact) },

  { match: e => e.target.closest("[data-rvopen]"),
    run: el => openFromReview(el.dataset.rvopen, el.dataset.rvp==="1") },

  { match: e => (e.target.dataset && e.target.dataset.ovbg) ? e.target : null,
    run: () => closeReviewOverlay() }
];

const INPUT_ROUTES = [
  { match: e => e.target.id==="qIn" ? e.target : null,
    run: (el, e) => setSearchQuery(e.target.value) }
];

/* 周期を変えたら、曜日・日にちの欄を出し分けるために描き直す */
const TPL_FORM_CHANGE_ROUTES = [
  { match: e => (e.target.id==="tCycle" && ui.tplDraft) ? e.target : null,
    run: () => changeTemplateCycle() }
];

/* コンテキスト名の変更：使用中の行動をまとめて追従させる */
const CTX_CHANGE_ROUTES = [
  { match: e => (e.target.classList && e.target.classList.contains("ctx-in")) ? e.target : null,
    run: el => renameContext(el, +el.dataset.cix) }
];

const KEYDOWN_ROUTES = [
  { match: e => (e.target.id==="ctxNew" && isSubmitEnter(e)) ? e.target : null,
    run: el => addContextNew(el) },

  { match: e => (e.target.id==="pAdd" && isSubmitEnter(e)) ? e.target : null,
    run: el => addProjectAction(el) },

  { match: e => {
      const card = e.target.closest && e.target.closest("[data-tplrun]");
      return (card && (e.key==="Enter" || e.key===" ")) ? card : null;
    },
    run: (card, e) => triggerTemplateCardClick(e, card) },

  /* カーソル行を開く。[data-tplrun] カード上の Enter はカードのクリックに
     譲るため、このルートは上のカード用ルートより後ろに置く。
     ボタンにフォーカスがある状態の Enter は「そのボタンを押す」意味なので
     除外する（除外しないと、ボタンの実行とカーソル行を開く動作が同時に起きる）。 */
  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName);
      return (!typing && ui.review===null && e.key==="Enter") ? e.target : null;
    },
    run: () => openCursorItem() },

  { match: e => e.key==="Escape" ? e.target : null,
    run: () => dismissActive() },

  /* j/k/x/e … 一覧のカーソル移動と行操作。レビューのオーバーレイ表示中は動かさない。 */
  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && ui.review===null && e.key==="j") ? e.target : null;
    },
    run: () => moveListCursor(1) },

  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && ui.review===null && e.key==="k") ? e.target : null;
    },
    run: () => moveListCursor(-1) },

  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && ui.review===null && e.key==="x") ? e.target : null;
    },
    run: () => toggleCursorDone() },

  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && ui.review===null && e.key==="e") ? e.target : null;
    },
    run: () => clarifyCursorItem() },

  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && ui.review===null && e.key==="t") ? e.target : null;
    },
    run: () => toggleCursorToday() },

  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && e.key==="n") ? e.target : null;
    },
    run: (el, e) => focusCapture(e) },

  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && e.key==="/") ? e.target : null;
    },
    run: (el, e) => focusSearch(e) },

  /* Cmd/Ctrl+Z で直前の変更を取り消す。入力欄にフォーカスがあるときは
     何もしない（テキストの取り消しはブラウザ標準に任せる）。 */
  { match: e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      return (!typing && (e.metaKey || e.ctrlKey) && e.key.toLowerCase()==="z") ? e.target : null;
    },
    run: (el, e) => { e.preventDefault(); undoLast(); } }
];

/* ==== src/js/90-app.js ==== */
/* =========================================================
   イベント
   ========================================================= */
function renderAll(){ renderRail(); renderFilters(); renderList(); renderPanel(); }

function capture(){
  const el = $("#capIn"), v = el.value.trim();
  if(!v) return;
  db.items.push(newItem(v));
  el.value = ""; save();
  if(ui.view!=="inbox"){ ui.view = "inbox"; }
  renderAll(); el.focus();
}
$("#capBtn").addEventListener("click", guard("収集", capture));
$("#capIn").addEventListener("keydown", guard("収集", e => { if(isSubmitEnter(e)) capture(); }));

document.addEventListener("click", guard("クリック処理", e => {
  runRoutes(CLICK_ROUTES, e);
}));

document.addEventListener("input", guard("入力処理", e => {
  runRoutes(INPUT_ROUTES, e);
}));

/* 周期を変えたら、曜日・日にちの欄を出し分けるために描き直す */
document.addEventListener("change", guard("定型フォーム", e => {
  runRoutes(TPL_FORM_CHANGE_ROUTES, e);
}));

/* コンテキスト名の変更：使用中の行動をまとめて追従させる */
document.addEventListener("change", guard("コンテキスト編集", e => {
  runRoutes(CTX_CHANGE_ROUTES, e);
}));
document.addEventListener("keydown", guard("キー操作", e => {
  runRoutes(KEYDOWN_ROUTES, e);
}));
$("#fileIn").addEventListener("change", guard("読み込み", e => { if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; }));

/* ---------- 起動 ---------- */
try{
  load();
  if(!ui.storeOK){
    $("#noStore").classList.remove("hide");
    $("#savedAt").textContent = "自動保存 不可";
  }else{
    $("#savedAt").textContent = "自動保存 有効";
  }
  renderAll();
  $("#capIn").focus();
  window.__minamoBooted = true;
}catch(err){
  showError("起動", err && err.stack || String(err));
}

})();
</script>
